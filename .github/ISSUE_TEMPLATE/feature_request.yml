name: 功能建议
description: 建议一个新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 这个功能解决什么问题？为什么现有方式不够？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你期望的交互或实现方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他解决方式？
  - type: checkboxes
    id: license
    attributes:
      label: 许可确认
      options:
        - label: 我理解本项目采用非商业许可证，建议不代表会承诺实现或发布日期。
          required: true
